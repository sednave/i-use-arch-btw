[bar.default]
auto_hide = true
background_opacity = 0.0
center = [ "group:g1" ]
contact_shadow = true
end = [ "group:g3" ]
font_family = "Aero"
reserve_space = false
start = [ "group:g2" ]
widget_spacing = 24

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g1"
    members = [ "cat", "clock", "cat_2" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    id = "g2"
    members = [ "launcher", "wallpaper", "workspaces" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g3"
    members = [ "media", "tray", "bluetooth", "volume", "brightness", "control-center", "session" ]
    opacity = 1.0
    padding = 6.0

