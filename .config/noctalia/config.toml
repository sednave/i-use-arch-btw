[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/Videos/Wallpapers"

[plugins]
enabled = [ "noctalia/bongocat", "noctalia/mpvpaper" ]

[shell]
app_icon_color = "primary"
app_icon_colorize = true
font_family = "Maple Mono"

    [shell.animation]
    speed = 0.65000000968575478

    [shell.panel]
    launcher_placement = "attached"

    [shell.screen_corners]
    enabled = true
    size = 69

[theme]
builtin = "Catppuccin"
community_palette = "Occult Umbral"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "vibrant"

[wallpaper]
directory = "/home/arona/Pictures/Wallpapers"
transition_duration = 420
transition_on_startup = true

    [wallpaper.default]
    path = "/home/arona/Pictures/Wallpapers/Yuki.jpg"

    [wallpaper.last]
    path = "/home/arona/Pictures/Wallpapers/Yuki.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/arona/Pictures/Wallpapers/Yuki.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/arona/Pictures/Wallpapers/Yuki.jpg"

[widget.cat]
audio_spectrum = true
rave_mode = true
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.cat_2]
audio_spectrum = true
rave_mode = true
tappy_mode = true
type = "noctalia/bongocat:cat"